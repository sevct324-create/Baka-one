  <script>
  /* Bundled from supabase-sync.js */
/* Supabase Auth, RLS-scoped state persistence, and private evidence uploads. */
(function () {
  const SESSION_KEY = 'mo-mangrove-supabase-session-v1';
  const STATE_KEY = 'mo-mangrove-restoration-v1';
  const config = () => ({ url: String(window.MO_SUPABASE_URL || '').replace(/\/$/, ''), key: window.MO_SUPABASE_PUBLISHABLE_KEY || '' });
  let session = null;
  let saveTimer = null;

  function readSession() {
    if (session) return session;
    try { session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch (_) { session = null; }
    return session;
  }
  function setSession(value) {
    session = value || null;
    if (session) localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    else localStorage.removeItem(SESSION_KEY);
  }
  function configured() {
    const c = config();
    if (!c.url || !/^https:\/\//.test(c.url) || !c.key) throw new Error('Add the Supabase Project URL and publishable key in api-config.js first.');
    return c;
  }
  async function request(path, options = {}, auth = true) {
    const c = configured();
    const s = readSession();
    const headers = Object.assign({ apikey: c.key, 'Content-Type': 'application/json' }, options.headers || {});
    if (auth && s?.access_token) headers.Authorization = `Bearer ${s.access_token}`;
    else headers.Authorization = `Bearer ${c.key}`;
    const response = await fetch(`${c.url}${path}`, Object.assign({}, options, { headers }));
    const text = await response.text();
    let body = null;
    try { body = text ? JSON.parse(text) : null; } catch (_) { body = text; }
    if (!response.ok) throw new Error(body?.msg || body?.message || body?.error_description || body?.error || `Supabase returned HTTP ${response.status}.`);
    return body;
  }
  async function refresh() {
    const s = readSession();
    if (!s?.refresh_token) return null;
    if (s.expires_at && s.expires_at > Date.now() + 60000) return s;
    const next = await request('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: s.refresh_token }) }, false);
    setSession(Object.assign({}, next, { expires_at: Date.now() + (next.expires_in || 3600) * 1000 }));
    return session;
  }
  async function authRequest(path, payload) {
    const value = await request(path, { method: 'POST', body: JSON.stringify(payload) }, false);
    if (value?.access_token) setSession(Object.assign({}, value, { expires_at: Date.now() + (value.expires_in || 3600) * 1000 }));
    return value;
  }
  async function signIn(email, password) { return authRequest('/auth/v1/token?grant_type=password', { email, password }); }
  async function signUp(email, password) { return authRequest('/auth/v1/signup', { email, password }); }
  async function signOut() {
    try { if (readSession()?.access_token) await request('/auth/v1/logout', { method: 'POST', body: '{}' }); }
    finally { setSession(null); }
  }
  function user() { return readSession()?.user || null; }
  async function load() {
    await refresh();
    const u = user();
    if (!u) return null;
    const rows = await request(`/rest/v1/app_state?select=payload&owner_id=eq.${encodeURIComponent(u.id)}&limit=1`);
    return rows?.[0]?.payload || null;
  }
  function isDataUrl(value) { return typeof value === 'string' && /^data:image\//i.test(value); }
  async function uploadEvidence(siteId, dataUrl) {
    const s = await refresh();
    if (!s?.user?.id) throw new Error('Sign in before uploading evidence photos.');
    const match = dataUrl.match(/^data:(image\/[a-zA-Z0-9.+-]+);base64,([\s\S]+)$/);
    if (!match) throw new Error('Evidence photo must be a valid image.');
    const mime = match[1];
    const ext = (mime.split('/')[1] || 'jpg').replace('jpeg', 'jpg').replace(/[^a-z0-9]/gi, '');
    const path = `${s.user.id}/${siteId}/${crypto.randomUUID()}.${ext}`;
    const binary = atob(match[2]);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const c = configured();
    const response = await fetch(`${c.url}/storage/v1/object/mangrove-evidence/${path}`, {
      method: 'POST', headers: { apikey: c.key, Authorization: `Bearer ${s.access_token}`, 'Content-Type': mime, 'x-upsert': 'false' }, body: bytes
    });
    if (!response.ok) { let err = {}; try { err = await response.json(); } catch (_) {} throw new Error(err.message || `Photo upload failed (HTTP ${response.status}).`); }
    await request('/rest/v1/evidence_files', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates' }, body: JSON.stringify({ owner_id: s.user.id, site_id: String(siteId), storage_path: path, content_type: mime }) });
    return { storagePath: path, contentType: mime };
  }
  async function photoUrl(photo) {
    if (typeof photo === 'string' && photo.startsWith('data:image/')) return photo;
    const path = photo?.storagePath;
    if (!path) return '';
    await refresh();
    const result = await request(`/storage/v1/object/sign/mangrove-evidence/${path}`, { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) });
    const c = configured();
    return result.signedURL?.startsWith('http') ? result.signedURL : `${c.url}/storage/v1${result.signedURL}`;
  }
  async function saveNow(currentState) {
    await refresh();
    const s = readSession();
    if (!s?.user?.id) return false;
    const payload = JSON.parse(JSON.stringify(currentState));
    for (const [siteId, evidence] of Object.entries(payload.evidence || {})) {
      if (isDataUrl(evidence?.photo)) {
        evidence.photo = await uploadEvidence(siteId, evidence.photo);
        currentState.evidence[siteId].photo = evidence.photo;
      }
    }
    localStorage.setItem(STATE_KEY, JSON.stringify(currentState));
    await request('/rest/v1/app_state?on_conflict=owner_id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ owner_id: s.user.id, payload, updated_at: new Date().toISOString() })
    });
    return true;
  }
  function queueSave(currentState, onResult) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => saveNow(currentState).then(ok => onResult?.(ok, null)).catch(error => onResult?.(false, error)), 500);
  }
  async function importLocal(currentState) { return saveNow(currentState); }

  window.MOSupabase = { configured: () => Boolean(config().url && config().key), user, signIn, signUp, signOut, load, queueSave, importLocal, photoUrl };
})();
  </script>

function settingsPanel(){let s=state.settings,w=s.weights||{};$('#dashboard').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Ecologist settings: safeguards and weights</h2><p>These are operational settings. Record approval from an LGU/ecologist before using them for a field decision.</p><form id="settingsForm"><div class="fields two"><div><label>Hydrology weight</label><input name="hydrology" type="number" min="0" step=".1" value="${w.hydrology??1.5}"></div><div><label>Erosion weight</label><input name="erosion" type="number" min="0" step=".1" value="${w.erosion??1}"></div><div><label>Wave-exposure weight</label><input name="wave" type="number" min="0" step=".1" value="${w.wave??1.1}"></div><div><label>Regeneration weight</label><input name="regeneration" type="number" min="0" step=".1" value="${w.regeneration??1.4}"></div><div><label>Minimum critical measurements</label><input name="minimumCritical" type="number" min="1" max="6" value="${s.minimumCritical}"></div><div><label>Survival alert threshold (%)</label><input name="survivalAlert" type="number" min="1" max="100" value="${s.survivalAlert}"></div></div><label><input name="hardStopErosion" type="checkbox" style="width:auto" ${s.hardStopErosion?'checked':''}> Stop planting recommendation for severe erosion</label><label><input name="hardStopWave" type="checkbox" style="width:auto" ${s.hardStopWave?'checked':''}> Stop planting recommendation for high wave exposure</label><button>Save safeguards</button></form></div>`);$('#settingsForm').onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.settings={...state.settings,weights:{hydrology:+d.hydrology,erosion:+d.erosion,wave:+d.wave,regeneration:+d.regeneration},minimumCritical:+d.minimumCritical,survivalAlert:+d.survivalAlert,hardStopErosion:e.target.hardStopErosion.checked,hardStopWave:e.target.hardStopWave.checked};save();alert('Safeguards saved. Recalculate suitability to apply them.');};}
function evidencePanel(){if(!active())return;let e=state.evidence[state.active]||{};$('#mapping').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Orani zone, occurrence, photo & GPS evidence</h2><p>Enter only verified local evidence. This does not claim an official barangay or mangrove-occurrence dataset.</p><form id="evidenceForm"><div class="fields two"><div><label>Barangay</label><input name="barangay" value="${esc(e.barangay||'')}"></div><div><label>Coastal / tidal zone</label><input name="zone" value="${esc(e.zone||'')}" placeholder="e.g., tidal creek fringe"></div><div><label>Local occurrence evidence</label><select name="occurrence"><option value="">Unknown</option><option ${e.occurrence==='confirmed'?'selected':''} value="confirmed">Confirmed locally</option><option ${e.occurrence==='unconfirmed'?'selected':''} value="unconfirmed">Unconfirmed</option></select></div><div><label>Evidence source</label><input name="source" value="${esc(e.source||'')}" placeholder="Observer, LGU/DENR record, community"></div><div><label>Latitude</label><input id="gpsLat" name="lat" value="${esc(e.lat||'')}"></div><div><label>Longitude</label><input id="gpsLng" name="lng" value="${esc(e.lng||'')}"></div></div><button type="button" class="secondary" id="getGps">Capture GPS location</button><label>Site photo</label><input id="sitePhoto" type="file" accept="image/*"><div id="photoPreview">${e.photo?`<img id="savedEvidencePhoto" src="" alt="Site evidence" style="max-width:180px;max-height:110px">`:''}</div><button>Save local evidence</button></form></div>`);$('#getGps').onclick=()=>navigator.geolocation?.getCurrentPosition(p=>{$('#gpsLat').value=p.coords.latitude.toFixed(6);$('#gpsLng').value=p.coords.longitude.toFixed(6)},()=>alert('GPS was unavailable or permission was not granted.'));$('#sitePhoto').onchange=ev=>{let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{ev.target.dataset.photo=r.result;$('#photoPreview').innerHTML=`<img src="${r.result}" alt="Site evidence" style="max-width:180px;max-height:110px">`};r.readAsDataURL(f)};$('#evidenceForm').onsubmit=ev=>{ev.preventDefault();let d=Object.fromEntries(new FormData(ev.target));d.photo=$('#sitePhoto').dataset.photo||e.photo||null;state.evidence[state.active]=d;save();alert('Local evidence saved.');};}
function fieldGuidePanel(){$('#assessment').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Gabay sa farmers: paano kumuha ng field data</h2><p>Hindi kailangang sagutan lahat. Unahin ang may <b>essential</b> sa form. Mag-picture, isulat ang petsa/oras, at kumuha ng 3–5 observations sa iba’t ibang bahagi ng site. Huwag magtanim hangga’t hindi malinaw ang daloy ng tubig-dagat.</p><div class="table-wrap"><table><tr><th>Data</th><th>Paano kumuha</th><th>Kagamitan</th><th>Praktikal na gabay</th></tr><tr><td><b>Tidal inundation / water depth</b></td><td>Maglagay ng patpat na may cm markings. Tingnan sa high at low tide sa ilang araw.</td><td>Marked stick/ruler, notebook, phone clock</td><td>Isulat kung gaano kadalas at gaano katagal lumulubog ang lugar.</td></tr><tr><td><b>Hydrological connectivity</b></td><td>Mag-obserba kung nakakapasok at nakakalabas ang tubig sa creek, culvert, o kanal.</td><td>Phone camera, notebook</td><td>Markahan bilang blocked kung may pilapil, tambak, saradong culvert, o putol na creek.</td></tr><tr><td><b>Salinity</b></td><td>Kumuha ng tubig o pore water sa parehong tide/time; sukatin bago magbago ang sample.</td><td>Handheld refractometer o salinity meter</td><td>Isulat ang value sa ppt/PSU. Kung wala nito, iwanang blank at humingi ng tulong sa LGU/BFAR/DENR.</td></tr><tr><td><b>Soil pH / texture</b></td><td>Kumuha ng soil sa 10–15 cm lalim sa 3–5 points. pH: slurry test; texture: tingnan kung mud/sand/clay.</td><td>pH meter/strips, clean container, gloves</td><td>Huwag hulaan ang pH. Ang soil texture ay puwedeng field observation, pero ilagay ang notes.</td></tr><tr><td><b>Elevation</b></td><td>Ihambing ang lupa sa regular high-tide level gamit ang staff/level survey.</td><td>Survey staff/level; technical support</td><td>Mas mainam ito gawin kasama ang LGU engineer, DENR, o trained surveyor dahil critical ito.</td></tr><tr><td><b>Wave exposure / erosion</b></td><td>Tingnan ang alon, pagguho ng pampang, exposed roots, at nawawalang lupa.</td><td>Phone camera, measuring tape</td><td>Mag-picture mula sa parehong point kada monitoring visit. Severe erosion o high waves: huwag agad magtanim.</td></tr><tr><td><b>Natural regeneration / species</b></td><td>Bilangin o i-record ang natural seedlings at adult mangroves sa site at kalapit na stand.</td><td>Phone camera, local guide/field ID</td><td>Kung maraming healthy natural seedlings, protektahan muna sila; hindi automatic na kailangan magtanim.</td></tr><tr><td><b>Disturbance</b></td><td>Itala ang fishpond dike, basura, cutting, grazing, boat traffic, at construction.</td><td>Camera, notebook</td><td>I-record ang location, date, at posibleng sanhi para may aksyon ang barangay/LGU.</td></tr></table></div><div class="notice"><b>Safety at verification:</b> Huwag mag-fieldwork mag-isa, i-check ang tide/weather, gumamit ng boots at gloves, at kumuha ng pahintulot kung pribadong lupa. Para sa elevation, species identification, at hydrology, magpa-validate sa LGU, DENR, BFAR, academe, o trained coastal technician.</div></div>`)}
function historyPanel(){if(!active())return;let records=state.history[state.active]||[];$('#satellite').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Historical condition record</h2><p>Add cloud-masked, documented observations from different dates. Values are user-entered unless an authenticated imagery workflow is connected.</p><form id="historyForm" class="fields two"><div><label>Observation date</label><input name="date" type="date" required></div><div><label>NDVI</label><input name="ndvi" type="number" step=".01" min="-1" max="1"></div><div><label>Shoreline condition</label><select name="shore"><option>stable</option><option>accreting</option><option>eroding</option></select></div><div><label>Method / source</label><input name="source" placeholder="Sentinel date, field survey, etc."></div><button>Add historical record</button></form>${historySummary(records)}`);$('#historyForm').onsubmit=e=>{e.preventDefault();let r=Object.fromEntries(new FormData(e.target));(state.history[state.active]??=[]).push(r);state.history[state.active].sort((a,b)=>a.date.localeCompare(b.date));save();show('satellite')};}
function historySummary(r){if(r.length<2)return '<div class="notice">Add at least two dated records to calculate a change trend.</div>';let a=r[0],b=r[r.length-1],change=(+b.ndvi)-(+a.ndvi);return `<div class="success">NDVI change, ${esc(a.date)} to ${esc(b.date)}: ${change.toFixed(2)}. Interpret with cloud masking, tide, and field validation.</div><table><tr><th>Date</th><th>NDVI</th><th>Shoreline</th><th>Source</th></tr>${r.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.ndvi||'—')}</td><td>${esc(x.shore)}</td><td>${esc(x.source||'—')}</td></tr>`).join('')}</table>`}
function costPanel(){if(!active())return;let c=state.costs[state.active]||{},p=state.plans[state.active]||{};$('#nursery').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Cost and work-plan calculator</h2><p>Enter direct PHP estimates. Seedling-stock cost from the nursery plan is included separately.</p><form id="costForm" class="fields two">${[['labor','Field labor'],['transport','Transport'],['protection','Fencing / wave protection'],['nurseryOps','Nursery operation'],['maintenance','Maintenance'],['monitoring','Monitoring']].map(([k,l])=>`<div><label>${l} (PHP)</label><input name="${k}" type="number" min="0" step=".01" value="${c[k]??0}"></div>`).join('')}<button>Save cost plan</button></form>${costSummary(c,p)}`);$('#costForm').onsubmit=e=>{e.preventDefault();state.costs[state.active]=Object.fromEntries([...new FormData(e.target)].map(([k,v])=>[k,+v||0]));save();show('nursery')};}
function costSummary(c,p){let items=Object.entries(c),other=items.reduce((a,[,v])=>a+(+v||0),0),seed=+p.cost||0;return `<table><tr><th>Seedlings / propagules</th><td>₱${seed.toLocaleString()}</td></tr>${items.map(([k,v])=>`<tr><th>${esc(k)}</th><td>₱${(+v).toLocaleString()}</td></tr>`).join('')}<tr><th>Total planned cost</th><td><b>₱${(seed+other).toLocaleString()}</b></td></tr></table>`}
function alertPanel(){if(!active())return;let records=state.monitoring[state.active]||[],threshold=state.settings.survivalAlert,last=records[records.length-1];let body=!last?'<div class="notice">No monitoring records yet.</div>':last.survival<threshold?`<div class="error"><b>Survival alert:</b> ${last.survival}% is below the configured ${threshold}% threshold.</div><ol><li>Validate counts and inspect affected plots.</li><li>Check tidal connection, sediment elevation, waves, pests, and grazing.</li><li>Address the identified cause before gap filling or replanting.</li><li>Record corrective action and schedule follow-up monitoring.</li></ol>`:`<div class="success">Latest survival rate (${last.survival}%) meets the ${threshold}% alert threshold.</div>`;$('#monitoring').insertAdjacentHTML('beforeend',`<div class="panel"><h2>Monitoring alert & corrective action</h2>${body}</div>`);}
function dashboard(){const sites=state.sites, areas=sites.reduce((a,s)=>a+(s.areaHa||0),0), as=Object.values(state.assessments), plans=Object.values(state.plans);$('#dashboard').innerHTML=`<div class="hero"><h1>Plan restoration around ecological recovery</h1><p>Map sites, combine field and satellite evidence, assess hydrology and suitability, then select appropriate intervention—not simply planting.</p></div><div class="stats"><div class="card stat"><small>Assessed sites</small><strong>${sites.length}</strong></div><div class="card stat"><small>Total mapped area</small><strong>${areas.toFixed(2)} ha</strong></div><div class="card stat"><small>High suitability</small><strong>${as.filter(a=>a.score>=80).length}</strong></div><div class="card stat"><small>Needs rehabilitation</small><strong>${as.filter(a=>/Hydrological|rehabilitation/.test(a.decision||'')).length}</strong></div><div class="card stat"><small>Planned seedlings</small><strong>${plans.reduce((a,p)=>a+(p.total||0),0).toLocaleString()}</strong></div></div><div class="grid"><div class="panel"><h2>Start a site assessment</h2><p>Draw or upload a site boundary, record practical field observations, then calculate transparent suitability and confidence.</p><button onclick="show('mapping')">Map a restoration site</button></div><div class="panel"><h2>Data integrity</h2><p>All records are retained in this browser. Satellite metadata is marked as actual only after a successful catalogue response; field data is separately labelled.</p><p class="muted">For shared, multi-user deployment, connect the documented data model to a secured database/API.</p></div></div>`}
let map, boundaryLayer, pointLayer, drawing=[];
function initMap(){let container=$('#map');if(!container)return;if(map&&map.getContainer()===container){map.invalidateSize();return}if(map)map.remove();map=L.map('map').setView([ORANI.lat,ORANI.lng],13);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);boundaryLayer=L.geoJSON().addTo(map);pointLayer=L.layerGroup().addTo(map);map.on('click',e=>{if(!$('#drawMode')?.checked)return;drawing.push(e.latlng);L.circleMarker(e.latlng,{radius:5,color:'#176b58'}).addTo(pointLayer);$('#drawHint').textContent=`${drawing.length} vertex/vertices — click “Finish polygon” when complete.`});drawExisting();}
function drawExisting(){if(!map)return;boundaryLayer.clearLayers();pointLayer.clearLayers();drawing=[];const s=active();if(!s)return;L.marker([ORANI.lat,ORANI.lng]).bindPopup('<b>Orani, Bataan</b><br>Municipal reference point — draw or upload the actual restoration boundary.').addTo(pointLayer);if(s.geojson){boundaryLayer.addData(s.geojson);const b=boundaryLayer.getBounds();if(b.isValid())map.fitBounds(b,{padding:[20,20]})} (s.points||[]).forEach(p=>L.marker([p.lat,p.lng]).bindPopup(esc(p.label||'Sampling point')).addTo(pointLayer));}
function areaM2(coords){const R=6378137,rad=x=>x*Math.PI/180;let sum=0;for(let i=0;i<coords.length;i++){let p=coords[i],q=coords[(i+1)%coords.length];sum+=(rad(q[0])-rad(p[0]))*(2+Math.sin(rad(p[1]))+Math.sin(rad(q[1])))}return Math.abs(sum*R*R/2)}
function mapping(){$('#mapping').innerHTML=`<div class="grid"><div class="panel"><h2>Restoration site & mapping</h2><p class="muted">OpenStreetMap base map. Boundary area is computed geodesically and stored as GeoJSON.</p><label>Active site</label><select id="siteSelect">${siteOptions()}</select><div class="toolbar"><button id="newSite">New site</button><button class="secondary" id="uploadGeo">Upload GeoJSON</button><button class="secondary" id="exportGeo">Export GeoJSON</button></div><form id="siteForm"><div class="fields two"><div><label class="required">Site name</label><input name="name" required value="${esc(active()?.name||'')}"></div><div><label>Assessment date</label><input name="date" type="date" value="${active()?.date||new Date().toISOString().slice(0,10)}"></div><div><label>Municipality</label><input name="municipality" value="${esc(active()?.municipality||'')}"></div><div><label>Province</label><input name="province" value="${esc(active()?.province||'')}"></div><div><label>Region</label><input name="region" value="${esc(active()?.region||'')}"></div><div><label>Area (auto, ha)</label><input id="areaHa" readonly value="${(active()?.areaHa||0).toFixed(4)}"></div></div><label>Project description</label><textarea name="description">${esc(active()?.description||'')}</textarea><button>Save site information</button></form></div><div class="panel"><h3>Boundary tools</h3><div class="map-tools"><label><input id="drawMode" type="checkbox" style="width:auto"> Draw polygon</label><button class="secondary" id="finishPoly">Finish polygon</button><button class="secondary" id="clearPoly">Clear boundary</button><button class="secondary" id="addPoint">Add sampling point</button></div><p id="drawHint" class="hint">Enable Draw polygon, then click map vertices.</p><div id="map"></div></div></div>`;
$('#siteSelect').onchange=e=>{state.active=e.target.value;save();show('mapping')};$('#newSite').onclick=()=>{let s={id:uid(),name:'New Orani restoration site',date:new Date().toISOString().slice(0,10),areaHa:0,points:[],...ORANI};state.sites.push(s);state.active=s.id;save();show('mapping')};$('#siteForm').onsubmit=e=>{e.preventDefault();let s=active(),d=Object.fromEntries(new FormData(e.target));Object.assign(s,d,ORANI);save();$('#areaHa').value=(s.areaHa||0).toFixed(4)};$('#finishPoly').onclick=finishPolygon;$('#clearPoly').onclick=()=>{if(active()){active().geojson=null;active().areaHa=0;save();drawExisting();$('#areaHa').value='0.0000'}};$('#addPoint').onclick=()=>{let label=prompt('Sampling point label');if(label!==null){map.once('click',e=>{active().points=active().points||[];active().points.push({lat:e.latlng.lat,lng:e.latlng.lng,label});save();drawExisting()});alert('Click a location on the Orani map.')}};$('#uploadGeo').onclick=()=>$('#geojsonFile').click();$('#exportGeo').onclick=exportGeo;
}
function finishPolygon(){if(drawing.length<3)return alert('At least three vertices are needed.');let ring=drawing.map(x=>[x.lng,x.lat]);ring.push(ring[0]);let s=active();if(!s)return;s.geojson={type:'Feature',properties:{name:s.name},geometry:{type:'Polygon',coordinates:[ring]}};s.areaHa=areaM2(ring)/10000;save();drawExisting();$('#areaHa').value=s.areaHa.toFixed(4);$('#drawHint').textContent=`Boundary saved: ${s.areaHa.toFixed(4)} ha.`}
$('#geojsonFile').onchange=e=>{const f=e.target.files[0];if(!f||!active())return;const r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result),feat=o.type==='Feature'?o:o.features?.[0];if(!feat?.geometry||!['Polygon','MultiPolygon'].includes(feat.geometry.type))throw Error('Polygon GeoJSON required');active().geojson=feat;let ring=feat.geometry.type==='Polygon'?feat.geometry.coordinates[0]:feat.geometry.coordinates[0][0];active().areaHa=areaM2(ring)/10000;save();show('mapping')}catch(x){alert('Unable to read GeoJSON: '+x.message)}};r.readAsText(f)};
function exportGeo(){let s=active();if(!s?.geojson)return alert('Draw or upload a boundary first.');download(`${s.name||'site'}-boundary.geojson`,JSON.stringify(s.geojson,null,2),'application/geo+json')}
const fieldDefs=[['soilSalinity','Soil salinity','ppt / PSU','essential'],['waterSalinity','Water salinity','ppt / PSU','optional'],['soilPH','Soil pH','0–14','essential'],['soilTexture','Soil texture','mud, sand, clay, loam','essential'],['soilOM','Soil organic matter','%','optional'],['soilMoisture','Soil moisture','%','optional'],['waterDepth','Water depth','cm','optional'],['inundation','Tidal inundation','frequent / moderate / infrequent','essential'],['inundationDuration','Inundation duration','hours/tide','optional'],['elevation','Elevation vs local tidal datum','m','essential'],['hydrology','Hydrological connectivity','good / altered / blocked','essential'],['wave','Wave exposure','low / moderate / high','essential'],['erosion','Shoreline erosion','none / moderate / severe','essential'],['vegetation','Existing vegetation','free text','optional'],['existingSpecies','Existing mangrove species','free text','optional'],['regeneration','Natural regeneration','none / sparse / healthy','essential'],['disturbance','Disturbance / human activities','none / low / moderate / high','essential']];
function assessment(){if(requireSite()){$('#assessment').innerHTML=requireSite();return}let m=state.measurements[state.active]||{};$('#assessment').innerHTML=`<div class="panel"><h2>Environmental field assessment</h2><p>Enter what is available. Essential fields are prioritized, but missing data is excluded from suitability scoring and shown in the confidence result. Measure salinity with a calibrated meter/refractometer, pH with a calibrated probe, elevation against a local tidal datum, and record flooding across tidal cycles.</p><form id="assessmentForm"><div class="fields">${fieldDefs.map(([id,l,u,kind])=>`<div class="field"><label class="${kind==='essential'?'required':''}">${l}</label>${['soilTexture','inundation','hydrology','wave','erosion','regeneration','disturbance'].includes(id)?selectField(id,m[id]):`<input name="${id}" value="${esc(m[id]||'')}" placeholder="${u}">`}<small>${u} · ${kind}</small></div>`).join('')}</div><label>Field method / observer notes</label><textarea name="notes" placeholder="Instrument, date, limitations, observations">${esc(m.notes||'')}</textarea><button>Save field assessment</button></form></div>`;$('#assessmentForm').onsubmit=e=>{e.preventDefault();state.measurements[state.active]=Object.fromEntries(new FormData(e.target));save();alert('Field assessment saved.');};}
function selectField(n,v){let opts={soilTexture:['mud','sandy mud','sand','clay','loam'],inundation:['frequent','moderate','infrequent'],hydrology:['good','altered','blocked'],wave:['low','moderate','high'],erosion:['none','moderate','severe'],regeneration:['none','sparse','healthy'],disturbance:['none','low','moderate','high']}[n];return `<select name="${n}"><option value="">Not measured</option>${opts.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`}
async function searchSentinel(){let s=active(),out=$('#satResult');if(!s?.geojson)return;out.innerHTML='<p class="muted">Querying Copernicus Data Space catalogue…</p>';let c=s.geojson.geometry.coordinates[0],wkt='POLYGON(('+c.map(p=>p.join(' ')).join(',')+'))', start=$('#satStart').value||'2024-01-01',end=$('#satEnd').value||new Date().toISOString().slice(0,10);let url='https://catalogue.dataspace.copernicus.eu/odata/v1/Products?$filter='+encodeURIComponent(`Collection/Name eq 'SENTINEL-2' and OData.CSC.Intersects(area=geography'SRID=4326;${wkt}') and ContentDate/Start gt ${start}T00:00:00.000Z and ContentDate/Start lt ${end}T23:59:59.999Z`)+ '&$top=20&$orderby=ContentDate/Start desc';try{let r=await fetch(url);if(!r.ok)throw Error('Catalogue responded '+r.status);let d=await r.json(),items=d.value||[];state.satellite[state.active]={source:'actual Copernicus catalogue metadata',queriedAt:new Date().toISOString(),items:items.map(x=>({name:x.Name,date:x.ContentDate?.Start,cloud:x.Attributes?.find(a=>/cloud/i.test(a.Name))?.Value??'not supplied',id:x.Id}))};save();out.innerHTML=items.length?`<div class="success">Actual catalogue metadata retrieved at ${new Date().toLocaleString()}. Processing pixels/indices requires an authenticated imagery service or user-supplied measurements.</div><div class="table-wrap"><table><tr><th>Acquisition</th><th>Product</th><th>Cloud cover</th></tr>${items.map(x=>`<tr><td>${esc(x.ContentDate?.Start?.slice(0,10)||'—')}</td><td>${esc(x.Name)}</td><td>${esc(String(x.Attributes?.find(a=>/cloud/i.test(a.Name))?.Value??'not supplied'))}</td></tr>`).join('')}</table></div>`:'<div class="notice">The catalogue returned no Sentinel-2 products for this area/date window. No satellite values were inferred.</div>'}catch(e){out.innerHTML=`<div class="error">Satellite catalogue unavailable: ${esc(e.message)}. This is not represented as satellite data. Enter field observations and, if you have processed index values, record them below as user-supplied estimates.</div>`}}
function satellite(){if(requireSite()){$('#satellite').innerHTML=requireSite();return}let sat=state.satellite[state.active];$('#satellite').innerHTML=`<div class="grid"><div class="panel"><h2>Sentinel-2 availability</h2><p>Searches the public Copernicus Data Space catalogue for Sentinel-2 products intersecting your saved site. This confirms imagery metadata, not index values.</p><div class="fields two"><div><label>From</label><input id="satStart" type="date" value="2024-01-01"></div><div><label>To</label><input id="satEnd" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><button id="searchSat">Find imagery</button><div id="satResult">${sat?`<p class="success">Last metadata query: ${new Date(sat.queriedAt).toLocaleString()} (${sat.items.length} products).</p>`:'<p class="muted">No catalogue query yet.</p>'}</div></div><div class="panel"><h2>Index evidence</h2><p>For processed reflectance, use cloud-masked Sentinel-2 L2A: NDVI=(B8−B4)/(B8+B4); NDWI=(B3−B8)/(B3+B8); MNDWI=(B3−B11)/(B3+B11); EVI=2.5(B8−B4)/(B8+6B4−7.5B2+1); SAVI=1.5(B8−B4)/(B8+B4+0.5). B11 is 20 m; resample transparently.</p><form id="indexForm" class="fields"><div><label>NDVI (user supplied)</label><input name="ndvi" value="${state.measurements[state.active]?.ndvi||''}" placeholder="-1 to 1"></div><div><label>NDWI (user supplied)</label><input name="ndwi" value="${state.measurements[state.active]?.ndwi||''}" placeholder="-1 to 1"></div><div><label>MNDWI (user supplied)</label><input name="mndwi" value="${state.measurements[state.active]?.mndwi||''}" placeholder="-1 to 1"></div><div><label>EVI (user supplied)</label><input name="evi" value="${state.measurements[state.active]?.evi||''}"></div><div><label>SAVI (user supplied)</label><input name="savi" value="${state.measurements[state.active]?.savi||''}"></div><div><label>Source / processing note</label><input name="indexNote" value="${esc(state.measurements[state.active]?.indexNote||'')}" placeholder="e.g., date, cloud mask, tool"> function calculateBaseAssessment(){let m=state.measurements[state.active]||{}, rules=[['Tidal inundation',m.inundation,{frequent:85,moderate:75,infrequent:45},1.2,'field'],['Elevation',m.elevation,v=>v!==''&&v>=-0.5&&v<=2?85:35,1.2,'field'],['Salinity',m.soilSalinity,v=>v!==''&&v>=5&&v<=35?85:v!==''?45:null,1,'field'],['Soil pH',m.soilPH,v=>v!==''&&v>=6&&v<=8.5?80:v!==''?45:null,.7,'field'],['Soil texture',m.soilTexture,{mud:85,'sandy mud':80,loam:70,clay:65,sand:45},.8,'field'],['Hydrological connectivity',m.hydrology,{good:95,altered:40,blocked:15},1.5,'field'],['Wave exposure',m.wave,{low:90,moderate:60,high:20},1.1,'field'],['Erosion',m.erosion,{none:90,moderate:55,severe:20},1,'field'],['Natural regeneration',m.regeneration,{healthy:95,sparse:65,none:40},1.4,'field'],['Disturbance',m.disturbance,{none:90,low:75,moderate:45,high:20},1,'field'],['Vegetation index',m.ndvi,v=>v!==''&&v>=.2?70:v!==''?50:null,.4,'satellite-derived Sentinel-2 index']];let rows=rules.map(([name,val,rule,w,src])=>{let score=typeof rule==='function'?rule(parseFloat(val)):rule[val];return {name,value:val,score,weight:w,source:src}}), usable=rows.filter(r=>r.score!==null&&r.score!==undefined&&r.value!==''),total=usable.reduce((a,r)=>a+r.score*r.weight,0),weights=usable.reduce((a,r)=>a+r.weight,0),score=weights?total/weights:0, critical=['inundation','elevation','hydrology','wave','erosion','regeneration'],miss=critical.filter(x=>!m[x]), completeness=Math.round(100*usable.length/rules.length), confidence=miss.length?'Insufficient evidence':completeness>=70?'Moderate to high':'Limited';let decision,why;if(m.hydrology==='blocked'||m.hydrology==='altered'||(m.elevation!==''&&(+m.elevation<-0.5||+m.elevation>2))){decision='Hydrological rehabilitation';why='Altered tidal connection or elevation is a primary constraint. Restore site hydrology before considering planting.'}else if(m.regeneration==='healthy'){decision='Natural regeneration';why='Healthy recruitment was observed. Protect natural rec async function s2ReadBand(item,key,bounds){const href=item.assets[key]?.href;if(!href)throw Error('Missing Sentinel-2 '+key+' band');const tif=await GeoTIFF.fromUrl(href),im=await tif.getImage(),o=im.getOrigin(),r=im.getResolution(),coords=[[bounds[0],bounds[1]],[bounds[2],bounds[3]]],px=coords.map(c=>Math.floor((c[0]-o[0])/r[0])),py=coords.map(c=>Math.floor((c[1]-o[1])/r[1]));let x0=Math.max(0,Math.min(...px)-1),y0=Math.max(0,Math.min(...py)-1),x1=Math.min(im.getWidth(),Math.max(...px)+2),y1=Math.min(im.getHeight(),Math.max(...py)+2);if(x1<=x0||y1<=y0)throw Error(key+' band does not cover the site');const meta=item.assets[key]['raster:bands']?.[0]||{};return{data:await im.readRasters({window:[x0,y0,x1,y1],interleave:true}),x0,y0,x1,y1,o,r,scale:meta.scale??(key==='scl'?1:0.0001),offset:meta.offset??0}}
function s2Value(b,x,y){const px=Math.floor((x-b.o[0])/b.r[0])-b.x0,py=Math.floor((y-b.o[1])/b.r[1])-b.y0;if(px<0||py<0||px>=b.x1-b.x0||py>=b.y1-b.y0)return NaN;return +b.data[py*(b.x1-b.x0)+px]*b.scale+b.offset}

async function s2SummarizeScene(item,feature){const rings=s2Rings(feature.geometry),all=rings.flat(2),xs=all.map(p=>p[0]),ys=all.map(p=>p[1]),bounds=[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)];if(!all.length)throw Error('The site boundary has no polygon coordinates');const keys=['blue','green','red','nir','swir16','scl'],bands={};for(const key of keys)bands[key]=await s2ReadBand(item,key,bounds);const ref=bands.nir,cols=ref.x1-ref.x0,rows=ref.y1-ref.y0;if(cols*rows>500000)throw Error('This site boundary is too large for browser-based processing. Use a smaller area or a server-side zonal workflow.');const sums={ndvi:0,ndwi:0,mndwi:0,evi:0,savi:0},hist=Array(10).fill(0);let count=0;for(let row=0;row<rows;row++)for(let col=0;col<cols;col++){const x=ref.o[0]+(ref.x0+col+.5)*ref.r[0],y=ref.o[1]+(ref.y0+row+.5)*ref.r[1];if(!rings.some(poly=>s2Inside(x,y,poly[0])&&!poly.slice(1).some(hole=>s2Inside(x,y,hole))))continue;const scl=s2Value(bands.scl,x,y);if([0,1,3,8,9,10,11].includes(scl))continue;const b={blue:s2Value(bands.blue,x,y),green:s2Value(bands.green,x,y),red:s2Value(bands.red,x,y),nir:s2Value(bands.nir,x,y),swir:s2Value(bands.swir16,x,y)};if(Object.values(b).some(v=>!Number.isFinite(v)||v<0||v>1.5))continue;const ix=s2PixelIndices(b);if(Object.values(ix).some(v=>!Number.isFinite(v)))continue;for(const k of Object.keys(sums))sums[k]+=ix[k];hist[Math.min(9,Math.max(0,Math.floor((ix.ndvi+1)/.2)))]++;count++}if(!count)throw Error('No valid unclouded satellite pixels inside the mapped boundary');return{date:item.properties.datetime.slice(0,10),cloud:item.properties['eo:cloud_cover'],count,mean:Object.fromEntries(Object.entries(sums).map(([k,v])=>[k,v/count])),ndviHistogram:hist}}
function satellite(){if(requireSite()){$('#satellite').innerHTML=requireSite();return}const fil=state.settings.language==='fil',tr=(a,b)=>fil?b:a,c=siteCenter(active().geojson),saved=state.satellite[state.active]?.indexResult;$('#satellite').innerHTML='<div class="grid"><div class="panel"><h2>'+tr('Sentinel-2 availability','Pagkakaroon ng Sentinel-2')+'</h2><p>'+tr('Search the Copernicus catalogue for imagery over the saved site boundary.','Maghanap sa katalogo ng Copernicus ng mga imahe para sa hangganan ng lugar.')+'</p><div class="fields two"><div><label>'+tr('From','Mula')+'</label><input id="s2Start" type="date" value="'+new Date(Date.now()-90*86400000).toISOString().slice(0,10)+'"></div><div><label>'+tr('To','Hanggang')+'</label><input id="s2End" type="date" value="'+new Date().toISOString().slice(0,10)+'"></div></div><button id="findS2">'+tr('Find imagery','Maghanap ng imahe')+'</button><div id="satResult"></div><input id="satStart" type="hidden"><input id="satEnd" type="hidden"><div id="s2Map" class="sat-map"></div><small>Sentinel-2 cloudless mosaic (2021) by EOX IT Services GmbH · <a href="https://s2maps.eu" target="_blank" rel="noopener">s2maps.eu</a></small></div><div class="panel"><h2>'+tr('Index evidence','Ebidensya ng mga index')+'</h2><p>'+tr('Indices are calculated from cloud-masked Sentinel-2 L2A pixels inside the mapped boundary. Values below are area averages; the histogram shows the NDVI spread across valid pixels.','Kinakalkula ang mga index mula sa cloud-masked Sentinel-2 L2A pixels sa loob ng hangganan. Average ito ng lugar; ipinapakita ng histogram ang saklaw ng NDVI sa mga valid na pixel.')+'</p><button id="calcS2">'+tr('Get automatic indices and histograms','Kunin ang mga index at histogram')+'</button><div id="s2Result">'+(saved?'<p>'+tr('Last scenes','Huling mga kuha')+': '+esc(saved.dates.join(' → '))+'</p>':'<p class="muted">'+tr('No satellite calculation yet.','Wala pang kalkulasyon mula sa satellite.')+'</p>')+'</div><div class="notic async function calculateSatelliteIndices(){const out=$('#s2Result'),site=active();out.innerHTML='<p>Searching for clear scenes and calculating site-wide pixels…</p>';try{const body={collections:['sentinel-2-c1-l2a'],intersects:site.geojson.geometry,datetime:($('#s2Start').value||'2024-01-01')+'/'+($('#s2End').value||new Date().toISOString().slice(0,10)),limit:100,query:{'eo:cloud_cover':{lt:35}}},resp=await fetch('https://earth-search.aws.element84.com/v1/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!resp.ok)throw Error('Sentinel-2 catalogue response '+resp.status);const data=await resp.json(),items=(data.features||[]).filter(x=>x.assets?.blue&&x.assets?.green&&x.assets?.red&&x.assets?.nir&&x.assets?.swir16&&x.assets?.scl).sort((a,b)=>b.properties.datetime.localeCompare(a.properties.datetime)),chosen=[];for(const x of items){if(!chosen.some(y=>y.properties.datetime.slice(0,10)===x.properties.datetime.slice(0,10)))chosen.push(x);if(chosen.length===2)break}if(chosen.length<2)throw Error('Fewer than two usable scenes. Widen the date range and retry.');if(!window.GeoTIFF)window.GeoTIFF=await import('https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm');const obs=[];for(const item of chosen.reverse())obs.push(await s2SummarizeScene(item,site.geojson));const old=obs[0],latest=obs[1],delta={};for(const k of Object.keys(old.mean))delta[k]=latest.mean[k]-old.mean[k];const result={source:'Sentinel-2 L2A polygon pixels via Earth Search',dates:obs.map(x=>x.date),indices:latest.mean,delta,observations:obs};state.satellite[state.active]={...(state.satellite[state.active]||{}),indexResult:result};state.measurements[state.active]={...(state.measurements[state.active]||{}),...Object.fromEntries(Object.entries(latest.mean).map(([k,v])=>[k,v.toFixed(4)])),indexNote:'Sentinel-2 L2A cloud-masked site-wide pixel averages; '+latest.date};save();const bins=latest.ndviHistogram,labels=['−1 to −0.8','−0.8 to −0.6','−0.6 to −0.4','−0.4 to −0.2' /* Calls the private server endpoint; CDSE OAuth credentials never enter browser code. */
async function calculateSatelliteIndices(){
 const out=$('#s2Result'),site=active();
 if(!site?.geojson?.geometry){out.innerHTML='<div class="notice">Draw or upload a site boundary first.</div>';return}
 out.innerHTML='<p>Asking Copernicus Data Space to process cloud-masked imagery and site statistics…</p>';
 try{
  const base=String(window.MO_API_BASE_URL||'').replace(/\/$/,''),response=await fetch(base+'/api/sentinel-stats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({geometry:site.geojson.geometry,start:$('#s2Start').value,end:$('#s2End').value})});
  let result;try{result=await response.json()}catch{throw Error('The processing server returned an unreadable response. Check the API URL.')}
  if(!response.ok)throw Error(result.error||('Processing server replied '+response.status));
  const obs=result.observations||[],older=obs[obs.length-2],latest=obs[obs.length-1];if(!older||!latest)throw Error('Copernicus returned fewer than two usable dates.');
  state.satellite[state.active]={...(state.satellite[state.active]||{}),indexResult:result,source:result.source,queriedAt:new Date().toISOString()};
  state.measurements[state.active]={...(state.measurements[state.active]||{}),...Object.fromEntries(Object.entries(latest.indices).map(([k,v])=>[k,Number(v).toFixed(4)])),indexNote:'Copernicus Data Space Statistical API; cloud-masked polygon averages through '+latest.date};save();
  const names=['ndvi','ndwi','mndwi','evi','savi'];
  const table='<div class="table-wrap"><table><tr><th>Index</th><th>'+esc(older.date)+' mean</th><th>'+esc(latest.date)+' mean</th><th>Change</th></tr>'+names.map(k=>'<tr><td>'+k.toUpperCase()+'</td><td>'+Number(older.indices[k]).toFixed(4)+'</td><td>'+Number(latest.indices[k]).toFixed(4)+'</td><td><b>'+((result.delta[k]>=0?'+':'')+Number(result.delta[k]).toFixed(4))+'</b></td></tr>').join('')+'</table></div>';
  const histograms=names.map(name=>{const bins=latest.histograms?.[name]||[],max=Math.max(1,...bins.map(b=>Number(b.count)||0));return'<section class="index-hist"><h4>'+name.toUpperCase()+'</h4><div class="ndvi-histogram">'+bins.map(b=>'<div class="ndvi-bin"><strong>'+Number(b.count||0).toLocaleString()+'</strong><div class="ndvi-bar" style="height:'+Math.max(3,Math.round((Number(b.count)||0)/max*115))+'px"></div><span>'+Number(b.lowEdge).toFixed(2)+'–'+Number(b.highEdge).toFixed(2)+'</span></div>').join('')+'</div></section>'}).join('');
  out.innerHTML='<div class="success">'+esc(result.source)+' · '+esc(older.date)+' → '+esc(latest.date)+' · '+Number(latest.validPixels||0).toLocaleString()+' valid pixels.</div>'+table+'<h3>'+trS2('Site-wide index histograms','Mga histogram ng index sa buong lugar')+'</h3>'+histograms+'<p class="muted">'+trS2('These are Copernicus Statistical API results calculated from the mapped polygon. Index signals do not identify mangrove species.','Mga resulta ito ng Copernicus Statistical API batay sa iginuhit na hangganan. Hindi tinutukoy ng mga index signal ang uri ng bakawan.')+'</p>';
 }catch(error){let message=error.message;if(/Failed to fetch|NetworkError/i.test(message))message='Cannot reach the processing backend. For GitHub Pages, set the backend URL in api-config.js and allow the Pages origin on the server.';out.innerHTML='<div class="error">'+esc(message)+'</div>'}
}
